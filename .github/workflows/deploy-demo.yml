name: Deploy demo (aquapilot + straordinari)

# Pubblica su GitHub Pages sia l'app aquapilot (alla radice) sia la demo
# "Gestione Straordinari" nella sottocartella /straordinari/, così convivono.
on:
  push:
    branches: [claude/overtime-request-app-m24utk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # App aquapilot (radice del repository) -> dist/
      - run: npm ci
      - run: npm run build

      # Demo straordinari -> overtime-app/dist/
      - run: npm ci
        working-directory: overtime-app
      - run: npm run build
        working-directory: overtime-app

      # Assembla il sito: aquapilot alla radice, straordinari in /straordinari/
      - name: Assembla sito
        run: |
          rm -rf _site
          mkdir -p _site/straordinari
          cp -r dist/* _site/
          cp -r overtime-app/dist/* _site/straordinari/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

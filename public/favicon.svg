<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- White background -->
  <rect width="64" height="64" rx="8" fill="#ffffff"/>
  <!-- A — dark blue, geometric bold -->
  <text x="2" y="48"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="42"
    letter-spacing="-2"
    fill="#1B3A6B">A</text>
  <!-- P — same dark blue -->
  <text x="33" y="48"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="42"
    letter-spacing="-2"
    fill="#1B3A6B">P</text>
</svg>
